[package]
name = "ruber"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "ruber"
path = "src/bin/main.rs"

[lib]
name = "ruber_lib"
path = "src/lib/lib.rs"

[dependencies]
anyhow = "1.0.94"
async-ssh2-lite = { version = "0.5.0", features = ["tokio"] }
config = "0.14.1"
infer = "0.16.0"
log = "0.4.22"
log4rs = "1.3.0"
notify = "7.0.0"
serde = { version = "1.0.216", features = ["derive"] }
thiserror = "2.0.7"
tokio = { version = "1.42.0", features = ["full"] }

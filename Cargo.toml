[package]
name = "ruber"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "ruber"
path = "src/bin/main.rs"

[lib]
name = "ruber_lib"
path = "src/lib/lib.rs"

[dependencies]
anyhow = "1.0.104"
async-ssh2-lite = { version = "0.5.0", features = ["tokio"] }
config = "0.15.25"
infer = "0.22.0"
log = "0.4.34"
log4rs = "1.4.0"
notify = "8.2.0"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
